location ^~ /api/granboard/ {
    # Resolve the optional service per request so the web container can start alone.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $granboard_upstream http://@GRANBOARD_HOST@:8081;
    proxy_pass $granboard_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    client_max_body_size 512;
    gzip off;
}
