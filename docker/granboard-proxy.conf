location ^~ /api/granboard/ {
    if ($granboard_trusted_proxy = 0) { return 403; }
    if ($granboard_lan = 0) { return 403; }
    # A missing or invalid forwarded address leaves the original proxy address in place.
    if ($remote_addr = $realip_remote_addr) { return 403; }

    # Resolve the optional service per request so the web container can start alone.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $granboard_upstream http://@GRANBOARD_HOST@:8081;
    # Older app images forward only the public path and cannot reach these endpoints.
    rewrite ^/api/granboard/(status|session|events|lights)$ /_granboard_lan/$1 break;
    proxy_pass $granboard_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    client_max_body_size 512;
    gzip off;
}
