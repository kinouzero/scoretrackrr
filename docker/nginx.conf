worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    include /tmp/scoretrackrr-granboard-network.conf;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Revalidate documents, worker, version metadata and unhashed static files.
    map $uri $cache_control {
        default "no-cache";
        ~^/_app/immutable/ "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json application/manifest+json text/css image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Keep directory redirects on the public proxy origin and port.
        absolute_redirect off;
        add_header Cache-Control $cache_control;
        add_header X-Content-Type-Options nosniff always;

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            try_files $uri =404;
        }

        include /tmp/scoretrackrr-granboard.conf;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
