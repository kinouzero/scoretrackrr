name: CI
on:
  push:
    branches: ['**']
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      granboard_release_tag:
        description: Published stable tag that needs its GranBoard relay image
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ inputs.granboard_release_tag && format('refs/tags/{0}', inputs.granboard_release_tag) || github.ref }}
  cancel-in-progress: ${{ inputs.granboard_release_tag == '' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    if: ${{ !inputs.granboard_release_tag }}
    name: Application checks, browsers and coverage
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container:
      # Keep the bundled browsers in sync with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001 --ipc=host
    defaults:
      run:
        shell: bash
    outputs:
      publish: ${{ steps.eligibility.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check publication eligibility
        id: eligibility
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
            node scripts/release-eligibility.mjs
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: python3 -B -m unittest discover -s tests -p granboard_relay_test.py
      - run: pnpm test:coverage --maxWorkers=4
      - run: pnpm build
        env:
          COVERAGE: '1'
      - run: pnpm test:e2e --workers=2 --max-failures=1
        env:
          COVERAGE: '1'
      - run: pnpm coverage:report
      - name: Upload source coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-coverage
          path: |
            coverage/combined/
            coverage/unit/coverage-summary.json
            coverage/browser/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: GitHub release and container images
    needs: verify
    if: >-
      ${{ !cancelled() &&
      ((needs.verify.result == 'success' && needs.verify.outputs.publish == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.granboard_release_tag != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify release source before publishing
        id: source
        env:
          RELEASE_TAG: ${{ inputs.granboard_release_tag || github.ref_name }}
          RELAY_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if [[ "$RELAY_ONLY" == true ]]; then
            [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]
            revision=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
            git merge-base --is-ancestor "$revision" refs/remotes/origin/master
            version=$(git show "$revision:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
            test "$version" = "${RELEASE_TAG#v}"
            published=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not')
            test "$published" = true
          else
            node scripts/release-eligibility.mjs
            revision="$GITHUB_SHA"
            version="${RELEASE_TAG#v}"
          fi
          {
            echo "version=$version"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare the tagged relay sources
        id: relay_context
        if: ${{ inputs.granboard_release_tag != '' }}
        env:
          RELEASE_SHA: ${{ steps.source.outputs.revision }}
        run: |
          context=$(mktemp -d "$RUNNER_TEMP/granboard-release.XXXXXXXX")
          git archive "$RELEASE_SHA" LICENSE docker/granboard/relay.py | tar -x -C "$context"
          cp docker/granboard/Dockerfile "$context/docker/granboard/Dockerfile"
          echo "path=$context" >> "$GITHUB_OUTPUT"
      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set DOCKERHUB_USERNAME as a repository variable or secret.' >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set the DOCKERHUB_TOKEN repository secret.' >&2; exit 1; }
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'Invalid Docker Hub username.' >&2; exit 1; }
      - name: Set image names and version
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "ghcr=ghcr.io/${REPOSITORY,,}"
            echo "dockerhub=docker.io/$DOCKERHUB_USERNAME/scoretrackrr"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the published Compose image versions
        if: ${{ !inputs.granboard_release_tag }}
        env:
          GHCR_IMAGE: ${{ steps.images.outputs.ghcr }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          web=$(docker compose --env-file /dev/null config --images)
          images=$(docker compose --env-file /dev/null -f compose.yaml -f compose.granboard.yaml --profile granboard config --images)
          test "$web" = "$GHCR_IMAGE:$VERSION"
          grep -Fxq "$web" <<< "$images"
          grep -Fxq "$GHCR_IMAGE:granboard-$VERSION" <<< "$images"
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the web image to both registries
        if: ${{ !inputs.granboard_release_tag }}
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.images.outputs.ghcr }}:${{ steps.source.outputs.version }}
            ${{ steps.images.outputs.ghcr }}:${{ github.ref_name }}
            ${{ steps.images.outputs.dockerhub }}:${{ steps.source.outputs.version }}
            ${{ steps.images.outputs.dockerhub }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
          provenance: true
          sbom: true
      - name: Publish the GranBoard relay image to both registries
        id: relay
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ steps.relay_context.outputs.path || '.' }}
          file: ${{ steps.relay_context.outputs.path || '.' }}/docker/granboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.images.outputs.ghcr }}:granboard-${{ steps.source.outputs.version }}
            ${{ steps.images.outputs.dockerhub }}:granboard-${{ steps.source.outputs.version }}
          labels: |
            org.opencontainers.image.title=Scoretrackrr GranBoard Relay
            org.opencontainers.image.description=Bluetooth relay for GranBoard 3s
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=release-granboard
          cache-to: type=gha,mode=max,scope=release-granboard
          provenance: true
          sbom: true
      - name: Create GitHub release after publishing web and relay images
        if: ${{ !inputs.granboard_release_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GHCR_IMAGE: ${{ steps.images.outputs.ghcr }}
          DOCKERHUB_IMAGE: ${{ steps.images.outputs.dockerhub }}
          VERSION: ${{ steps.source.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          RELAY_DIGEST: ${{ steps.relay.outputs.digest }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          ## Web image (linux/amd64 and linux/arm64)

          - \`$GHCR_IMAGE:$VERSION\`
          - \`$DOCKERHUB_IMAGE:$VERSION\`

          Image digest: \`$WEB_DIGEST\`.

          ## GranBoard relay image (linux/amd64 and linux/arm64)

          - \`$GHCR_IMAGE:granboard-$VERSION\`
          - \`$DOCKERHUB_IMAGE:granboard-$VERSION\`

          Image digest: \`$RELAY_DIGEST\`.

          Follow the [GranBoard relay setup guide]($REPO_URL/wiki/Hosting#optional-granboard-relay-for-iphone).
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; leaving its notes and assets unchanged.'
          else
            compose_archive="$RUNNER_TEMP/scoretrackrr-compose-$GITHUB_REF_NAME.tar.gz"
            git archive --format=tar.gz --output="$compose_archive" HEAD compose.yaml compose.granboard.yaml docker/granboard-proxy.conf
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --notes-file "$notes" "$compose_archive"
          fi
