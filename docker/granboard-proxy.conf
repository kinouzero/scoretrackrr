location ^~ /api/granboard/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $granboard_upstream http://granboard:8081;
    proxy_pass $granboard_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 30s;
    client_max_body_size 512;
    gzip off;
}
